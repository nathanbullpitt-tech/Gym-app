<html lang="en-AU">
<head>

<meta name="description" content="Food, training, weight and an AI coach in one app.">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Kilo Coach">

<style>
/* Layout: one-screen phone app. Sticky header, scrolling panels, floating pill tab bar. Sport-tech direction: dark-first like a performance watch face, activity rings, semi-condensed technical numerals, mono micro-labels, one electric blue plus a colour per metric. */
:root{
  --bg:#06080c; --surface:#0f131a; --raise:#171c26; --sunk:#0a0d12; --ink:#eef2f7; --muted:#8792a4; --line:#1d2431;
  --accent:#4d7cff; --accent-ink:#ffffff; --accent-soft:#17234b; --hi:#ffcf3a;
  --good:#2fd58a; --warn:#ffa940; --bad:#ff5468;
  --mp:#ff8a3d; --mc:#28e0c4; --mf:#b383ff; --mw:#3ab7ff;
  --display:"Saira Semi Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:20px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1f5; --surface:#ffffff; --raise:#f4f6fa; --sunk:#e6eaf0; --ink:#0a111c; --muted:#5b6677; --line:#dde2ea;
  --accent:#2e5bf0; --accent-ink:#ffffff; --accent-soft:#e2e9fe; --hi:#c99700;
  --good:#0f9e62; --warn:#d0730c; --bad:#e0344b; --mp:#e4661a; --mc:#0ea791; --mf:#8550e2; --mw:#138fd6; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f5; --surface:#ffffff; --raise:#f4f6fa; --sunk:#e6eaf0; --ink:#0a111c; --muted:#5b6677; --line:#dde2ea;
  --accent:#2e5bf0; --accent-ink:#ffffff; --accent-soft:#e2e9fe; --hi:#c99700;
  --good:#0f9e62; --warn:#d0730c; --bad:#e0344b; --mp:#e4661a; --mc:#0ea791; --mf:#8550e2; --mw:#138fd6; color-scheme:light}
html:root[data-kcc="blue"][data-kcm="dark"]{--bg:#06080c; --surface:#0f131a; --raise:#171c26; --sunk:#0a0d12; --ink:#eef2f7; --muted:#8792a4; --line:#1d2431; --accent:#4d7cff; --accent-ink:#ffffff; --accent-soft:#17234b; --hi:#ffcf3a; --good:#2fd58a; --warn:#ffa940; --bad:#ff5468; --mp:#ff8a3d; --mc:#28e0c4; --mf:#b383ff; --mw:#3ab7ff; color-scheme:dark}
html:root[data-kcc="blue"][data-kcm="light"]{--bg:#eef1f5; --surface:#ffffff; --raise:#f4f6fa; --sunk:#e6eaf0; --ink:#0a111c; --muted:#5b6677; --line:#dde2ea; --accent:#2e5bf0; --accent-ink:#ffffff; --accent-soft:#e2e9fe; --hi:#c99700; --good:#0f9e62; --warn:#d0730c; --bad:#e0344b; --mp:#e4661a; --mc:#0ea791; --mf:#8550e2; --mw:#138fd6; color-scheme:light}
html:root[data-kcc="pink"][data-kcm="dark"],html:root[data-kcc="pink"][data-kcm="auto"]{--bg:#0b0609; --surface:#170f14; --raise:#21161d; --sunk:#0f0a0d; --ink:#f9eef4; --muted:#ab929f; --line:#2e1f28; --accent:#ff5fa8; --accent-ink:#1d0612; --accent-soft:#3d1630; --hi:#ffc94d; --good:#3ddc97; --warn:#ffb054; --bad:#ff6b5e; --mp:#ff9a52; --mc:#2fd8c4; --mf:#c69bff; --mw:#5ac8ff; color-scheme:dark}
@media (prefers-color-scheme: light){html:root[data-kcc="pink"][data-kcm="auto"]{--bg:#fbf1f6; --surface:#ffffff; --raise:#fdf6fa; --sunk:#f4e3ec; --ink:#2b0f1e; --muted:#7c5a6b; --line:#f0d8e4; --accent:#d4307f; --accent-ink:#ffffff; --accent-soft:#fbe0ee; --hi:#b98400; --good:#0f9e62; --warn:#c4650a; --bad:#d63a2f; --mp:#e4661a; --mc:#0ea791; --mf:#8550e2; --mw:#138fd6; color-scheme:light}}
html:root[data-kcc="pink"][data-kcm="light"],html:root[data-kcc="pink"][data-kcm="auto"][data-theme="light"]{--bg:#fbf1f6; --surface:#ffffff; --raise:#fdf6fa; --sunk:#f4e3ec; --ink:#2b0f1e; --muted:#7c5a6b; --line:#f0d8e4; --accent:#d4307f; --accent-ink:#ffffff; --accent-soft:#fbe0ee; --hi:#b98400; --good:#0f9e62; --warn:#c4650a; --bad:#d63a2f; --mp:#e4661a; --mc:#0ea791; --mf:#8550e2; --mw:#138fd6; color-scheme:light}
html:root[data-kcc="pink"][data-kcm="auto"][data-theme="dark"]{--bg:#0b0609; --surface:#170f14; --raise:#21161d; --sunk:#0f0a0d; --ink:#f9eef4; --muted:#ab929f; --line:#2e1f28; --accent:#ff5fa8; --accent-ink:#1d0612; --accent-soft:#3d1630; --hi:#ffc94d; --good:#3ddc97; --warn:#ffb054; --bad:#ff6b5e; --mp:#ff9a52; --mc:#2fd8c4; --mf:#c69bff; --mw:#5ac8ff; color-scheme:dark}
.swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sw{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.sw i{width:22px;height:22px;border-radius:50%;flex:none}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
body{padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.16em;text-transform:uppercase}
.brand .logo{width:26px;height:26px}
.brand .muted{font-weight:500}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.panel{display:flex;flex-direction:column;gap:12px;padding-block:4px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.datebar{display:flex;align-items:center;gap:8px}
.datebar .lbl{flex:1;text-align:center;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em}
.datebar .lbl .small{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.datebar button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px}
.big{font-family:var(--display);font-weight:700;font-size:52px;line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--muted);font-weight:500;margin-left:4px;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.track>span{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.track.over>span{background:var(--bad)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.macro .v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
.macro .v small{font-size:14px;color:var(--muted);font-weight:500}
.macro .track{height:6px;margin-top:6px}
/* Rings */
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring-in{position:relative;text-align:center;line-height:1}
.ring-big{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.01em}
.ring-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.hero-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.hero-macros{display:flex;flex-direction:column;gap:12px;min-width:0}
.hm{display:flex;align-items:center;gap:12px;min-width:0}
.hm-v{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.hm-v span{font-size:13px;color:var(--muted);font-weight:500}
.hero-foot{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.hero-foot b{color:var(--ink);font-family:var(--display);font-size:15px}
.today-rings{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.rl{display:flex;flex-direction:column;gap:10px;min-width:0}
.rl .ri{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:8px;align-items:baseline}
.rl .dot{width:10px;height:10px;border-radius:50%;align-self:center}
.rl .rv{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.rl .rk{grid-column:2;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-width:360px){.hero-grid,.today-rings{grid-template-columns:1fr;justify-items:center}}
/* Meals */
.meal{padding:0;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:10px;padding:14px 16px}
.meal-h .t{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;flex:1}
.meal-h .c{color:var(--muted);font-size:13px;font-family:var(--mono)}
.add{border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:99px;padding:7px 14px;font-size:13px}
.items{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .n{flex:1;min-width:0}
.item button.n{all:unset;cursor:pointer;flex:1;min-width:0;display:block}
.item .n div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.item .k{font-family:var(--display);font-weight:600;font-size:17px}
.x{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1}
.ghost{border:1px dashed var(--line);background:none;border-radius:99px;padding:8px 14px;color:var(--muted);font-size:13px;margin:0 16px 14px}
.btn{border:0;border-radius:99px;padding:13px 18px;font-weight:600;letter-spacing:.01em;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px -12px var(--accent)}
.btn.sec{background:var(--raise);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5}
.btn.wide{width:100%}
label.f{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:0}
input.i,textarea.i,select.i{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px 13px;color:var(--ink);font-family:var(--body);font-size:16px;letter-spacing:0;text-transform:none}
input.i:focus,textarea.i:focus,select.i:focus{outline:none;border-color:var(--accent)}
textarea.i{resize:vertical;min-height:84px}
input.i[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:48px;line-height:24px;text-align:left}
input.i[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input.i[type=date]::-webkit-calendar-picker-indicator{margin:0}
.grid2>*,.grid4>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--raise);color:var(--muted);border:1px solid var(--line)}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)} .pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li button.open{all:unset;cursor:pointer;flex:1;min-width:0;display:block}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:9.5px;font-family:var(--mono)}
.chart .dot{fill:var(--muted);opacity:.55}
.chart .avg{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.14}
.chart .end{fill:var(--accent)}
.chart .goal{stroke:var(--hi);stroke-width:1.5;stroke-dasharray:4 4}
/* Coach */
.chat{display:flex;flex-direction:column;gap:10px}
.b{max-width:88%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;line-height:1.45}
.b.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.b.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.composer{position:fixed;z-index:6;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding:6px;border-radius:30px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.composer textarea.i{border:0;background:transparent;resize:none}
body.typing nav.tabs{display:none}
body.coach::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(158px + env(safe-area-inset-bottom,0px));background:var(--bg);z-index:5;pointer-events:none}
body.coach.typing::after{height:calc(78px + env(safe-area-inset-bottom,0px))}
body.coach .composer{background:var(--surface)}
.kbd-hide{display:none;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--raise);color:var(--ink);place-items:center;align-self:center}
body.typing .kbd-hide{display:grid}
body.typing .composer{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#p-coach{padding-bottom:96px}
.chat>*{scroll-margin-bottom:190px}
.b.a ul{margin:4px 0;padding-left:18px}
.composer textarea{min-height:48px;max-height:140px;flex:1;border-radius:24px}
.coach-head{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--accent) 0 72%,var(--accent-soft) 0);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);position:relative}
.avatar::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.avatar{isolation:isolate}
.avatar>*{position:relative;z-index:1}
/* Tab bar */
nav.tabs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;max-width:540px;margin:0 auto;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;box-shadow:0 16px 40px -18px rgba(0,0,0,.6)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-radius:20px}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(2,4,8,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 0}
.sheet .wrap{display:flex;flex-direction:column;gap:14px;padding-block:12px 8px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:99px;padding:8px 4px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 0 var(--line) inset,0 2px 8px -4px rgba(0,0,0,.4)}
.est{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.est input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.ex{display:flex;flex-direction:column;gap:10px}
.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 30px;gap:8px;align-items:center}
.setrow .sn{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.setrow.small span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.hint{font-size:12.5px;color:var(--muted);background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.hint b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 40px)}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-align:center;padding-bottom:2px}
.cal button.d{border:1px solid transparent;background:var(--sunk);border-radius:12px;min-height:54px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cal button.d.out{opacity:.35}
.cal button.d.today{border-color:var(--accent);background:var(--accent-soft)}
.cal .dn{font-family:var(--display);font-weight:600;font-size:15px;line-height:1}
.marks{display:flex;gap:3px;justify-content:center;min-height:7px}
.mk{width:7px;height:7px;border-radius:50%;display:inline-block}
.mk.good{background:var(--good)}.mk.over{background:var(--bad)}.mk.under{background:var(--warn)}.mk.w{background:var(--hi)}
.bar{width:70%;height:4px;border-radius:2px;background:var(--accent);display:inline-block}
.bar.plan{background:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}
.weekbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;position:relative;margin-top:14px}
.weekbars .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.weekbars .bb{width:100%;max-width:14px;border-radius:99px;background:var(--accent)}
.weekbars .bb.none{background:var(--sunk);height:6px}
.weekbars .bb.over{background:var(--bad)}
.weekbars .dl{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:14px}
.tline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--hi);pointer-events:none;opacity:.8}
.ck{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .box{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.ck.on .box{background:var(--good);border-color:var(--good)}
.ck.on .grow>div:first-child{color:var(--muted)}
.mini{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:500;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.mini.on{background:var(--good);color:#fff;border-color:var(--good)}
.wk.is-today{border-color:var(--accent)}
.dayname{all:unset;cursor:pointer;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.dayname .pill{text-transform:uppercase;vertical-align:middle}
.li.pick{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;text-align:left;font:inherit;cursor:pointer}
.li.pick:last-child{border-bottom:0}
.cal .dn.ok{color:var(--good)}
.small .mk{vertical-align:middle;margin-left:2px}
.restbar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:8px 10px 8px 18px;z-index:2;box-shadow:0 10px 30px -12px var(--accent)}
.restbar .chip{background:transparent;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 45%,transparent)}
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mstat{border:1px solid var(--line);background:var(--sunk);border-radius:14px;padding:9px 2px;text-align:center;color:inherit;font:inherit;min-width:0;cursor:pointer}
.mstat.on{border-color:var(--accent);background:var(--accent-soft)}
.mstat .v{font-family:var(--display);font-weight:700;font-size:20px;line-height:1}
.mstat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.phrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.phrow.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.phrow img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--sunk);display:block}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
details summary{list-style-position:inside}
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:2px}
.home-head h2{font-size:30px;margin-top:4px}
.home-head .pill{white-space:nowrap;flex:none}
.task{display:flex;gap:12px;align-items:flex-start}
.tk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;margin-top:1px}
.tk.on{background:var(--good);border-color:var(--good)}
.tt{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;line-height:1.25}
.task .add{min-width:34px}
.upcard{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.uppanel{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.upstrip{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:99px;background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.uppanel b,.upstrip b{color:var(--good);font-weight:600}
.btn.upgo{background:var(--good);color:#04140c;box-shadow:none}
input.i.upkg{border-color:var(--good);font-weight:600}
.setrow.l5{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 52px 28px}
.swappanel{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--raise);border:1px solid var(--line)}
.swappanel b{font-weight:600}
.setrow button.sn{all:unset;cursor:pointer;font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center;border-radius:8px;padding:6px 0}
.setrow button.sn.wu{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
@media (prefers-reduced-motion:no-preference){.track>span{transition:width .4s ease}.ring svg circle{transition:stroke-dasharray .6s ease}.sheet{animation:up .22s ease}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
/* live barcode scanner */
.scanov{position:fixed;inset:0;z-index:2000;background:#000;display:flex;flex-direction:column}
.scanov video{flex:1;width:100%;height:100%;object-fit:cover;min-height:0}
.scanov .frame{position:absolute;left:8%;right:8%;top:38%;height:22%;border:3px solid var(--accent);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
.scanov .bar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.scanov .top{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 4px #000}
.shr{min-width:44px;min-height:44px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:12px;cursor:pointer}
.shr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><svg class="logo" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke-width="3.5" style="stroke:var(--accent)" stroke-opacity=".22"/><circle cx="13" cy="13" r="10" fill="none" stroke-width="3.5" style="stroke:var(--accent)" stroke-linecap="round" stroke-dasharray="46 63" transform="rotate(-90 13 13)"/><circle cx="13" cy="13" r="3.4" style="fill:var(--ink)"/></svg><span>Kilo</span><span class="muted">Coach</span></div>
  <button class="iconbtn" id="btnSettings" aria-label="Targets and settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>

<main><div class="wrap">
  <div id="banner" class="banner" hidden></div>
  <section class="panel" id="p-home"></section>
  <section class="panel" id="p-today" hidden></section>
  <section class="panel" id="p-train" hidden></section>
  <section class="panel" id="p-weight" hidden></section>
  <section class="panel" id="p-coach" hidden></section>
</div></main>

<nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist">
  <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></svg>Today</button>
  <button role="tab" data-tab="today" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M17 3c-2.5 2-2.5 7 0 9v9"/></svg>Food</button>
  <button role="tab" data-tab="train" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
  <button role="tab" data-tab="weight" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>Progress</button>
  <button role="tab" data-tab="coach" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Coach</button>
</div></nav>

<div id="sheetHost"></div>
<div id="toast" class="toast" hidden></div>

<script src="/vendor/zxing.min.js"></script>
<script src="/runtime.js"></script>
<script>
const DEF = {cal:2250,p:225,c:197,f:63,goalDate:"2026-11-19",startKg:115,goalKg:"",sex:"m",age:26,heightCm:"",activity:1.55,goalRate:0.75,lastCheckIn:"",habits:{water:{on:true,target:3},steps:{on:true,target:8000},sleep:{on:true,target:7}},about:"26, about 115kg. Main goal: fat loss while keeping muscle. Beach trip on 19 November 2026, then building toward a triathlon in 2027. Lifts in the gym and works physically demanding days as a pest technician."};
const MEALS = ["Breakfast","Lunch","Dinner","Snacks"];
const S = {settings:{...DEF}, days:{}, weights:{}, workouts:[], foods:[], chat:[], templates:[], plan:{}, program:null, genDraft:null, meals:[], recipes:[], mealplan:null, measures:{}, photos:{}, reviews:{}, measKey:"waist", reviewOpen:false, date:today(), calMonth:today().slice(0,7), tab:"home", trainView:"today", loadedSettings:false, ob:null, forceOb:false, calView:"week", weekStart:null, undo:null, lastChanges:null};
let db=null, sample=null, online=false, assets=null, downloads=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,16);
const r0=n=>Math.round(Number(n)||0);
const r1=n=>Math.round((Number(n)||0)*10)/10;
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function today(){return iso(new Date())}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}
function fmtDate(s,o){return new Date(s+"T12:00:00").toLocaleDateString("en-AU",o||{weekday:"short",day:"numeric",month:"short"})}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function dbErr(e){const c=e&&e.code;return c==="quota_exceeded"?"Storage is full. Delete some old entries.":c==="resource_exhausted"?"Saving too fast. Give it a second.":"Couldn't save. Check your connection and try again."}

/* ---------- storage ---------- */
const queues={};
function write(path,fn){
  if(!db){toast("Open this in the Claude app to save.");return Promise.resolve()}
  const q=(queues[path]||Promise.resolve()).then(()=>fn(db.doc(path))).catch(e=>toast(dbErr(e)));
  queues[path]=q;return q;
}
function setDayFoods(date,foods){S.days[date]={...(S.days[date]||{}),foods};render();write("days/"+date,r=>r.set(S.days[date]))}
function dayFoods(date){return (S.days[date]&&S.days[date].foods)||[]}
function totals(foods){return foods.reduce((a,f)=>({cal:a.cal+r0(f.cal),p:a.p+r0(f.p),c:a.c+r0(f.c),f:a.f+r0(f.f)}),{cal:0,p:0,c:0,f:0})}

function applyTheme(t){t=t||{};const c=t.c==="pink"?"pink":"blue",m=["light","dark"].includes(t.m)?t.m:"auto",r=document.documentElement;if(c==="blue"&&m==="auto"){delete r.dataset.kcc;delete r.dataset.kcm}else{r.dataset.kcc=c;r.dataset.kcm=m}try{localStorage.setItem("kc-theme",JSON.stringify({c,m}))}catch(e){}
  {const pk=c==="pink",set=(id,h)=>{const l=document.getElementById(id);if(l&&l.getAttribute("href")!==h)l.setAttribute("href",h)};set("kcManifest",pk?"/manifest-pink.webmanifest":"/manifest.webmanifest");set("kcIcon",pk?"/icon-pink.svg":"/icon.svg");set("kcTouch",pk?"/apple-touch-icon-pink.png":"/apple-touch-icon.png");const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content=pk?"#0b0609":"#06080c"}}
try{applyTheme(JSON.parse(localStorage.getItem("kc-theme")||"null"))}catch(e){}
function setTheme(t){applyTheme(t);const n={...S.settings,theme:t};S.settings=n;write("settings/main",r=>r.set(n))}
async function boot(){
  online=!!window.KC;render();
  if(!window.claude||!window.claude.use){banner("Saving and the coach work when this page is open in Claude.");return}
  try{db=await claude.use("db")}catch(e){db=null}
  try{sample=await claude.use("sample")}catch(e){sample=null}
  claude.use("assets").then(a=>{assets=a;render()}).catch(()=>{});
  claude.use("downloads").then(d=>{downloads=d}).catch(()=>{});
  if(!db){banner("Saving isn't available in this view. Open the page signed in to Claude.");return}
  online=true;
  const onErr=()=>{if(!S.loadedSettings){S.loadedSettings=true;render()}banner("Lost the connection to your data. Reload the page.")};
  setTimeout(()=>{if(!S.loadedSettings){S.loadedSettings=true;render()}},4000);
  db.doc("settings/main").onSnapshot(s=>{S.settings={...DEF,...(s.exists?s.data():{})};if(S.settings.theme)applyTheme(S.settings.theme);S.loadedSettings=true;render()},onErr);
  db.collection("days").onSnapshot(q=>{const d={};q.docs.forEach(x=>d[x.id]=x.data());S.days=d;render()},onErr);
  db.collection("weights").onSnapshot(q=>{const d={};q.docs.forEach(x=>d[x.id]=x.data());S.weights=d;render()},onErr);
  db.collection("workouts").orderBy("date","desc").limit(300).onSnapshot(q=>{S.workouts=q.docs.map(x=>({id:x.id,...x.data()}));render()},onErr);
  db.collection("foods").onSnapshot(q=>{S.foods=q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.used||0)-(a.used||0));render()},onErr);
  db.collection("templates").onSnapshot(q=>{S.templates=q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));render()},onErr);
  db.collection("plan").onSnapshot(q=>{const d={};q.docs.forEach(x=>d[x.id]=x.data());S.plan=d;render()},onErr);
  db.collection("meals").onSnapshot(q=>{S.meals=q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.used||0)-(a.used||0));render()},onErr);
  db.collection("recipes").onSnapshot(q=>{S.recipes=q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));render()},onErr);
  db.doc("mealplan/current").onSnapshot(s=>{S.mealplan=s.exists?s.data():null},onErr);
  db.collection("measures").onSnapshot(q=>{const d={};q.docs.forEach(x=>d[x.id]=x.data());S.measures=d;render()},onErr);
  db.collection("photos").onSnapshot(q=>{const d={};q.docs.forEach(x=>d[x.id]=x.data());S.photos=d;render()},onErr);
  db.collection("reviews").onSnapshot(q=>{const d={};q.docs.forEach(x=>d[x.id]=x.data());S.reviews=d;render()},onErr);
  db.doc("programs/current").onSnapshot(s=>{S.program=s.exists?s.data():null;render()},onErr);
  db.doc("coach/chat").onSnapshot(s=>{if(!coachBusy){S.chat=(s.exists&&s.data().turns)||[];render()}},onErr);
  {const wait=()=>{if(S.loadedSettings)checkShare();else setTimeout(wait,300)};setTimeout(wait,300)}
}
window.addEventListener("kc-toast",e=>toast(e.detail));
const SHARE_ICON=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>`;
function sharePayloadOf(t){return {name:t.name||t.title||"Workout",exercises:(t.exercises||[]).filter(e=>e&&e.name).map(e=>({name:e.name,rx:e.rx||"",sets:(e.sets&&e.sets.length?e.sets.filter(x=>!x.w):[{}]).map(x=>({kg:"",reps:x.reps??""}))}))}}
async function shareWorkout(t){if(!window.KC)return;try{await KC.share("workout",sharePayloadOf(t).name,sharePayloadOf(t))}catch(e){toast("Couldn't make a share link. Try again")}}
async function sharePlan(){if(!window.KC||!S.templates.length)return;const name=(S.program&&S.program.name)||"My training plan";try{await KC.share("plan",name,{name,workouts:S.templates.map(sharePayloadOf)})}catch(e){toast("Couldn't make a share link. Try again")}}
async function checkShare(){
  const code=window.KC&&KC.pendingShare();if(!code)return;KC.clearShare();
  const sh=await KC.getShare(code).catch(()=>null);
  if(!sh||!sh.payload){toast("That share link has expired or is wrong");return}
  const list=sh.kind==="plan"?(sh.payload.workouts||[]):[sh.payload];
  const w=sheet(`<div class="sheet-h"><h2>Shared with you</h2>${closeBtn}</div><div class="small muted">${sh.kind==="plan"?`A plan with ${list.length} saved workouts`:"A saved workout"}. It copies the exercises, sets and reps only. You log your own weights, and nobody sees your stats.</div>
  ${list.map(x=>`<div class="card ex"><div style="font-weight:700">${esc(x.name)}</div><div class="small muted">${esc((x.exercises||[]).map(e=>e.name+(e.rx?` (${e.rx.split(",")[0]})`:"")).join(", "))}</div></div>`).join("")}
  <button class="btn wide" id="shAdd">${sh.kind==="plan"?`Add all ${list.length} to my saved workouts`:"Add to my saved workouts"}</button>`);
  w.querySelector("#shAdd").onclick=()=>{
    const taken=new Set(S.templates.map(t=>String(t.name).toLowerCase()));
    for(const x of list){let name=String(x.name||"Workout").slice(0,60);if(taken.has(name.toLowerCase()))name+=" (shared)";taken.add(name.toLowerCase());
      const id=uid(),doc={name,program:sh.kind==="plan"?String(sh.payload.name||"Shared plan").slice(0,60):"",exercises:(x.exercises||[]).slice(0,20).map(e=>({name:String(e.name).slice(0,80),rx:String(e.rx||"").slice(0,200),sets:(e.sets||[{}]).slice(0,10).map(z=>({kg:"",reps:z.reps??""}))}))};
      S.templates.push({id,...doc});write("templates/"+id,r=>r.set(doc))}
    closeSheet();S.tab="train";S.trainView="library";render();toast(list.length>1?`Added ${list.length} saved workouts`:"Added to your saved workouts. Tap Plan to put it on your calendar");
  };
}
function banner(m){const b=$("#banner");b.textContent=m;b.hidden=false}

/* ---------- tabs ---------- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();window.scrollTo(0,0)});
$("#btnSettings").onclick=openSettings;

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  ["home","today","train","weight","coach"].forEach(t=>$("#p-"+t).hidden=t!==S.tab);
  document.body.classList.toggle("coach",S.tab==="coach");if(S.tab!=="coach")document.body.classList.remove("typing");

async function shrink(file,max){
  const url=URL.createObjectURL(file);
  try{const img=new Image();img.src=url;await img.decode();const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
  finally{URL.revokeObjectURL(url)}
}
const okCode=s=>/^\d{8,14}$/.test(String(s||""));
async function offLookup(code){
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,brands,quantity,serving_size,serving_quantity,nutriments`,{signal:AbortSignal.timeout?AbortSignal.timeout(8000):undefined});
    if(!r.ok)return null;const j=await r.json();if(!j||j.status!==1||!j.product)return null;
    const p=j.product,n=p.nutriments||{},num=v=>v==null||v===""||isNaN(+v)?null:+v;
    const kcal=k=>{const a=num(n["energy-kcal_"+k]);if(a!=null)return a;const kj=num(n["energy-kj_"+k])??num(n["energy_"+k]);return kj!=null?kj/4.184:null};
    const per=k=>({cal:kcal(k),p:num(n["proteins_"+k]),c:num(n["carbohydrates_"+k]),f:num(n["fat_"+k])});
    let v=per("serving"),serving=String(p.serving_size||"").slice(0,30),note="";
    const sq=num(p.serving_quantity);
    if(v.cal==null){const h=per("100g");if(h.cal==null)return null;
      if(sq&&sq>0){const m=sq/100;v={cal:h.cal*m,p:(h.p||0)*m,c:(h.c||0)*m,f:(h.f||0)*m};serving=serving||sq+"g"}
      else{v=h;serving="100g";note="Values are per 100g. Use grams eaten when you add it."}}
    const brand=String(p.brands||"").split(",")[0].trim(),pn=String(p.product_name_en||p.product_name||"").trim();
    const name=(brand&&pn&&!pn.toLowerCase().includes(brand.toLowerCase())?brand+" "+pn:pn||brand)+(p.quantity&&!/\d/.test(pn)?" "+p.quantity:"");
    if(!name)return null;
    return {name:name.slice(0,80),serving,cal:r0(v.cal),p:r0(v.p),c:r0(v.c),f:r0(v.f),note};
  }catch(e){return null}
}
async function liveScan(onCode){

  const ov=document.createElement("div");ov.className="scanov";ov.setAttribute("role","dialog");ov.setAttribute("aria-label","Barcode scanner");
  ov.innerHTML=`<video playsinline muted autoplay></video><div class="frame"></div><div class="top">Line the barcode up in the box</div><div class="bar"><button class="btn sec" id="scTorch" hidden>Light</button><button class="btn" id="scX">Cancel</button></div>`;
  document.body.appendChild(ov);
  let stream=null,stopped=false,timer=null;
  const end=()=>{stopped=true;clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop());ov.remove()};
  ov.querySelector("#scX").onclick=end;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){end();toast("Camera access was blocked. Allow it in your browser settings, or take a photo instead");return}
  if(stopped){stream.getTracks().forEach(t=>t.stop());return}
  const v=ov.querySelector("video");v.srcObject=stream;try{await v.play()}catch(e){}
  const track=stream.getVideoTracks()[0];
  try{const caps=track.getCapabilities&&track.getCapabilities();if(caps&&caps.torch){const tb=ov.querySelector("#scTorch");tb.hidden=false;let on=false;tb.onclick=()=>{on=!on;track.applyConstraints({advanced:[{torch:on}]}).catch(()=>{})}}}catch(e){}
  let det=null;if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes("ean_13"))det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"].filter(x=>f.includes(x))})}catch(e){}}

        else{const W=v.videoWidth,H=v.videoHeight,cw=Math.min(W,1000),ch=Math.round(cw*(H*0.4)/W);c.width=cw;c.height=ch;ctx.drawImage(v,0,H*0.3,W,H*0.4,0,0,cw,ch);
          try{const res=zr.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c))));if(okCode(res.getText()))code=res.getText()}catch(e){}}
      }catch(e){}

}
async function decodeBarcode(file){
  let canvas=null;try{canvas=await shrink(file,1400)}catch(e){}
  if(canvas&&"BarcodeDetector" in window){try{const r=await new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]}).detect(canvas);if(r[0]&&okCode(r[0].rawValue))return r[0].rawValue}catch(e){}}
  if(canvas&&window.ZXing){try{
    const img=new Image();img.src=canvas.toDataURL("image/jpeg",.9);await img.decode();
    const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    const r=await new ZXing.BrowserMultiFormatReader(hints).decodeFromImageElement(img);if(r&&okCode(r.getText()))return r.getText();
  }catch(e){}}
  if(sample){try{const o=await sample.json(`Read the barcode number printed in digits under the barcode in this photo. Reply with only JSON like {"code":"9310000000000"}, or {"code":null} if you cannot read every digit.`,{images:file});if(o&&okCode(o.code))return String(o.code)}catch(e){}}
  return null;
}

/* ---------- ADAPTIVE EXPENDITURE ---------- */
function dietStart(){const ds=Object.keys(S.weights).filter(d=>S.weights[d]&&S.weights[d].kg).sort();return S.settings.dietStart||ds[0]||today()}
const waterPhaseEnd=()=>addDays(dietStart(),14);
function trendSeries(){
  const ds=Object.keys(S.weights).filter(d=>S.weights[d]&&S.weights[d].kg).sort();
  if(!ds.length)return [];
  const out=[],end=ds[ds.length-1];let t=null;
  for(let d=ds[0];d<=end;d=addDays(d,1)){const w=S.weights[d]&&S.weights[d].kg?+S.weights[d].kg:null;if(t==null)t=w;else if(w!=null)t=t+0.1*(w-t);out.push({d,kg:w,trend:t})}
  return out;
}
function expenditure(){
  const st=S.settings,tr=trendSeries(),end=addDays(today(),-1),start=addDays(end,-27),male=st.sex!=="f";
  const lastKg=tr.length?tr[tr.length-1].trend:+st.startKg;
  const h=+st.heightCm||(male?178:165),age=+st.age||26;
  const prior=(10*lastKg+6.25*h-5*age+(male?5:-161))*(+st.activity||1.55);
  const wS=waterPhaseEnd()>start?waterPhaseEnd():start;
  const intake=[];for(let d=wS;d<=end;d=addDays(d,1)){const c=totals(dayFoods(d)).cal;if(c>=800)intake.push(c)}
  const win=tr.filter(p=>p.d>=wS&&p.d<=end),weighIns=win.filter(p=>p.kg!=null).length;
  let conf=0,data=null;
  if(intake.length>=7&&win.length>=7&&weighIns>=4){
    const D=Math.max(1,daysBetween(win[0].d,win[win.length-1].d)),dKg=win[win.length-1].trend-win[0].trend;
    const avgIn=intake.reduce((a,b)=>a+b,0)/intake.length;
    data=Math.max(1200,Math.min(6000,avgIn-dKg*7700/D));
    conf=Math.min(1,intake.length/21)*Math.min(1,D/21);
  }
  const est=Math.round((data==null?prior:conf*data+(1-conf)*prior)/10)*10;
  const deficit=lastKg*((+st.goalRate||0.75)/100)*7700/7;
  const floor=Math.max(male?1500:1200,Math.round(est*0.65/10)*10);
  const target=Math.max(floor,Math.round((est-deficit)/10)*10);
  return {est,conf,logged:intake.length,weighIns,target,usedFloor:target===floor,lastKg,hasHeight:!!+st.heightCm};
}
function splitMacros(cal){const p=r0(S.settings.p),f=r0(cal*0.25/9),c=Math.max(0,r0((cal-p*4-f*9)/4));return {cal,p,c,f}}
function weekCard(){

function prsIn(w){if(isCardio(w))return [];const out=[];for(const e of w.exercises||[]){const h=liftHistory(e.name),i=h.findIndex(p=>p.id===w.id);if(i<1)continue;const prev=Math.max(...h.slice(0,i).map(p=>p.v));if(h[i].v>prev+0.01)out.push({name:e.name,v:h[i].v})}return out}

function restSecs(rx){const m=String(rx||"").match(/rest\s*(\d+(?:\.\d+)?)(?:\s*-\s*\d+(?:\.\d+)?)?\s*(min|m|s|sec)?/i);if(!m)return 90;const v=+m[1];return /^s/i.test(m[2]||"")?Math.round(v):Math.round(v*60)}

function avgHabit(k,days){const vals=[];for(let i=1;i<=days;i++){const v=habitVal(addDays(today(),-i),k);if(v)vals.push(v)}return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null}
function lossRate(){const ws=waterPhaseEnd(),from=addDays(today(),-21),pts=Object.keys(S.weights).filter(d=>S.weights[d]&&S.weights[d].kg&&d>=ws&&d>=from).sort().map(d=>({x:daysBetween(from,d),y:+S.weights[d].kg}));if(pts.length<6||pts[pts.length-1].x-pts[0].x<10)return null;const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n,slope=pts.reduce((a,p)=>a+(p.x-mx)*(p.y-my),0)/Math.max(1e-9,pts.reduce((a,p)=>a+(p.x-mx)**2,0));return {perWk:-slope*7,goal:my*((+S.settings.goalRate||0.75)/100)}}
function stepAdvice(){
  const st=S.settings,h=(st.habits||{}).steps;if(!h||!h.on)return null;
  if(st.goalKey&&st.goalKey!=="lose")return null;
  const lr=lossRate();if(!lr)return null;
  const cur=+h.target||8000,hits=[1,2,3,4,5,6,7].filter(i=>habitOk(addDays(today(),-i),"steps")).length;
  if(lr.perWk<lr.goal*0.6){
    if(hits<5)return {to:cur,same:true,why:`You're ${lr.perWk>=0?`losing about ${r1(lr.perWk)}`:`gaining about ${r1(-lr.perWk)}`} kg a week against a ${r1(lr.goal)} kg loss goal, but you hit ${cur.toLocaleString()} steps on ${hits} of the last 7 days. Make it most days before raising it.`};
    const to=Math.min(15000,cur+1000);return to===cur?null:{to,why:`You're ${lr.perWk>=0?`losing about ${r1(lr.perWk)}`:`gaining about ${r1(-lr.perWk)}`} kg a week against a ${r1(lr.goal)} kg loss goal. A bit more daily movement will close the gap.`};
  }
  if(lr.perWk>lr.goal*1.4){const to=Math.max(6000,cur-1000);return to===cur?null:{to,why:`You're losing about ${r1(lr.perWk)} kg a week, faster than your ${r1(lr.goal)} kg goal, so you can ease off a little and protect recovery.`}}
  return {to:cur,same:true,why:`On pace at about ${r1(lr.perWk)} kg a week. Keep ${cur.toLocaleString()} steps.`};
}

const GOALS=[["lose","Lose fat","Drop fat while keeping muscle"],["muscle","Build muscle","Lean bulk with slow weight gain"],["strength","Get stronger","Strength focus at maintenance"],["fitness","General fitness","Feel better and move better"],["endurance","Endurance","Support running, cycling or triathlon"]];

function actFactor(D){const a=ACT.find(x=>x[0]===D.act)||ACT[1];return Math.round((a[3]+0.03*Math.min(6,D.days.length))*1000)/1000}
function startTargets(D){
  const male=D.sex!=="f",kg=+D.kg,h=+D.heightCm,age=+D.age;
  const maint=Math.round((10*kg+6.25*h-5*age+(male?5:-161))*actFactor(D)/10)*10;
  let cal=maint;
  if(D.goal==="lose"){const def=kg*(D.rate/100)*7700/7;cal=Math.max(male?1500:1200,Math.round(maint*0.65/10)*10,Math.round((maint-def)/10)*10)}

  if(+D.cal>=1000&&+D.cal<=6000)cal=r0(D.cal);
  const ref=D.goal==="lose"&&+D.goalKg?Math.max(+D.goalKg,kg*0.8):kg;
  const p=Math.min(250,Math.max(90,Math.round(ref*(D.goal==="fitness"||D.goal==="endurance"?1.6:2)/5)*5));
  const f=r0(cal*0.25/9),c=Math.max(0,r0((cal-p*4-f*9)/4));

function rxEx(e){const sets=Math.max(1,Math.min(6,r0(e.sets)||3)),reps=String(e.reps||"8-12").slice(0,12),rest=String(e.rest||"").slice(0,20),note=String(e.note||"").slice(0,120);return {name:String(e.name).slice(0,60),rx:`${sets} × ${reps}${rest?", rest "+rest:""}${note?". "+note:""}`,sets:Array.from({length:sets},()=>({kg:"",reps:parseInt(reps)||""}))}}

    {name:"move_session",description:"Moves the planned session on one date to another date. If the target date already has a planned session, the two swap.",
     inputSchema:{type:"object",properties:{from:{type:"string",description:"YYYY-MM-DD"},to:{type:"string",description:"YYYY-MM-DD"}},required:["from","to"]},
     execute:i=>{const a=String(i.from),b=String(i.to);if(!isDate(a)||!isDate(b))throw new Error("Dates must be YYYY-MM-DD");if(!S.plan[a])throw new Error("Nothing is planned on "+a);const nm=S.plan[a].name,sw=S.plan[b];notePlan(a);notePlan(b);movePlan(a,b);return done(`Moved ${nm} from ${fmtDate(a)} to ${fmtDate(b)}${sw?`, swapped with ${sw.name}`:""}`)}},
    {name:"plan_session",description:"Plans a saved workout on a date, replacing anything planned there.",

     execute:i=>{const t=S.templates.find(x=>x.id===String(i.workout_id));if(!t)throw new Error("No saved workout with that id");const ex=exList(i.exercises);if(!ex.length)throw new Error("Give at least one exercise");noteTpl(t.id);const nm=i.name?String(i.name).slice(0,40):t.name,doc={name:nm,program:t.program||"",exercises:ex};

/* ---------- WEIGHT ---------- */
function weightSeries(){return trendSeries().map(p=>({d:p.d,kg:p.kg,avg:p.trend}))}
function chart(series){
  if(series.length<2)return `<div class="empty">Log a few mornings and your trend line appears here.</div>`;
  const W=340,H=170,L=34,R=10,T=12,B=22,pts=series.slice(-60),d0=pts[0].d,span=Math.max(1,daysBetween(d0,pts[pts.length-1].d));
  const vals=pts.flatMap(p=>p.kg!=null?[p.kg,p.avg]:[p.avg]);let lo=Math.floor(Math.min(...vals)-.5),hi=Math.ceil(Math.max(...vals)+.5);if(hi-lo<2)hi=lo+2;
  const x=d=>L+(W-L-R)*daysBetween(d0,d)/span,y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  const ticks=[lo,Math.round((lo+hi)/2),hi];
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(p.d).toFixed(1)},${y(p.avg).toFixed(1)}`).join("");
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
  ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="lbl num" x="${L-6}" y="${y(t)+3}" text-anchor="end">${t}</text>`).join("")}
  <path class="area" d="${line}L${x(last.d)},${H-B}L${x(d0)},${H-B}Z"/>
  ${pts.filter(p=>p.kg!=null).map(p=>`<circle class="dot" cx="${x(p.d).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="2.6"/>`).join("")}
  <path class="avg" d="${line}"/><circle class="end" cx="${x(last.d)}" cy="${y(last.avg)}" r="4.5"/>
  <text class="lbl" x="${L}" y="${H-6}">${esc(fmtDate(d0,{day:"numeric",month:"short"}))}</text><text class="lbl" x="${W-R}" y="${H-6}" text-anchor="end">${esc(fmtDate(last.d,{day:"numeric",month:"short"}))}</text></svg>`;
}

  const past=[];for(let i=1;i<=7;i++){const d=addDays(t,-i),f=dayFoods(d);if(f.length){const x=totals(f);past.push(`${d}: ${x.cal} cal, ${x.p}p`)}}

  lines.push(`Workouts in last 14 days: ${ws.map(w=>`${w.date} ${w.title}: ${isCardio(w)?cardioTxt(w):(w.exercises||[]).map(e=>`${e.name} ${setsTxt(e.sets)}`).join(" | ")}${w.notes?" (notes: "+w.notes+")":""}`).join(" || ")||"none logged"}.`);
  const x=expenditure(),ck=checks(t);
  {const pd=[1,2,3,4,5,6,7].map(i=>totals(dayFoods(addDays(t,-i)))).filter(v=>v.cal>=500);lines.push(`Protein target hit on ${pd.filter(v=>v.p>=st.p*0.95).length} of ${pd.length} logged days this week.`);const pj=projection();if(pj&&!pj.done)lines.push(`Goal projection: ${r1(pj.cur-pj.gk)} kg to go to ${pj.gk} kg, estimated ${pj.eta} at ${r1(pj.rate||pj.plan)} kg/week${pj.vs!=null?` (${pj.vs<=0?Math.abs(pj.vs)+" days ahead of":pj.vs+" days behind"} the ${st.goalDate} target)`:""}.`)}
  {const lr=lossRate(),as=avgHabit("steps",7),sl=avgHabit("sleep",7),sa=stepAdvice();lines.push(`Steps target ${((S.settings.habits||{}).steps||{}).target||"none"}, hit on ${[1,2,3,4,5,6,7].filter(i=>habitOk(addDays(today(),-i),"steps")).length} of the last 7 days. Sleep 7-day average ${sl!=null?r1(sl)+"h":"not logged"}. Weight loss rate (last 2 weeks): ${lr?r1(lr.perWk)+" kg/week vs goal "+r1(lr.goal):"not enough data"}.${sa&&!sa.same?" App suggests changing steps to "+sa.to:""}`)}
  if(habitsOn().length)lines.push(`Habits today: ${habitsOn().map(([k,l,u])=>`${l} ${habitVal(t,k)} of ${S.settings.habits[k].target}${u}`).join(", ")}.`);
  {const mm=MEAS.map(([k,l])=>{const v=measVals(k);if(!v.length)return "";const ch=r1(v[v.length-1].v-v[0].v);return `${l} ${v[v.length-1].v}cm${v.length>1?` (${ch>0?"+":""}${ch}cm since ${v[0].d})`:""}`}).filter(Boolean);if(mm.length)lines.push("Latest measurements: "+mm.join(", ")+".")}
  if(S.recipes.length)lines.push("Their recipes: "+S.recipes.map(r=>`${r.name} (${r.per.cal} cal, ${r.per.p}p per serve)`).join("; ")+".");
  lines.push(`Today's checklist: weigh-in ${ck.weigh?"done":"not yet"}, food marked complete ${ck.food?"yes":"not yet"}, training ${ck.rest?"rest day":ck.train?"done":"not yet"}. Checklist streak: ${streak()} days.`);
  if(S.program)lines.push(`Current training plan: ${S.program.name}, ${S.program.weeks} weeks from ${S.program.start}. ${S.program.summary} Progression: ${S.program.progression}`);
  lines.push(`Adaptive expenditure estimate: ${x.est} cal/day (confidence ${Math.round(x.conf*100)}%, from ${x.logged} logged days). Suggested target for his chosen pace: ${x.target} cal.`);
  const up=Object.keys(S.plan).filter(d=>d>=t&&d<=addDays(t,7)).sort();
  lines.push(`Planned sessions next 7 days: ${up.map(d=>d+" "+S.plan[d].name).join("; ")||"none"}. Saved workouts: ${S.templates.map(x=>x.name+" ("+(x.exercises||[]).map(e=>e.name).join(", ")+")").join("; ")||"none"}.`);
  return lines.join("\n");
}
function rules(){const n=S.settings.name?String(S.settings.name).split(" ")[0]:"the user";return `You are ${n}'s personal trainer and nutrition coach, built into their food, training and weight tracking app. You can see their logged data below. Coach like a good in-person PT: direct, specific, encouraging without flattery, and honest when they are off track. Call them ${n}.
Rules:
- Ground advice in their actual numbers. Mention specific figures when useful.
- Evidence-based. Fat loss target around 0.5 to 1% of bodyweight per week. Keep protein high and keep lifting to hold muscle. The first 1 to 2 weeks of a deficit drop extra water and glycogen, so fast early losses are not all fat: never cut calories or steps because of them, and expect the rate to slow after that.
- Do not recommend crash diets, very low calorie intakes, fasting extremes, dehydration or sauna tricks to drop weight. If they regularly eat far below target, say so and steer them back up.
- For pain, injury, dizziness or medical questions, give sensible general guidance and suggest a GP or physio.
- Write for a phone screen: short paragraphs or a short list, usually under 150 words unless they ask for a plan or detail.
- Australian English, metric units, Australian foods and supermarkets.
- Never use em dashes. No filler openers; get straight to the point.
- Plain text only: no markdown symbols such as ** or #. For lists, start lines with "- ".
When they ask for a workout, give exercises with sets, reps and a target weight based on what they lifted last time where the data shows it.
If app tools are available, you can change their calendar, saved workouts and nutrition targets. Only make changes when they ask, or after you suggest a change and they agree. Call get_calendar first to find dates and workout ids. After changing anything, list exactly what you changed in plain words. Never invent ids.`}
function mdLite(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#{1,4}\s+(.+)$/gm,"<b>$1</b>").replace(/^\s*[-*]\s+/gm,"• ")}
function renderCoach(){
  const p=$("#p-coach");
  if(online&&!S.loadedSettings){p.dataset.ob="";p.innerHTML=`<div class="empty">Loading…</div>`;return}
  if(!S.settings.onboarded||S.forceOb){if(!S.ob)S.ob={step:"name",d:obDefaults()};if(p.dataset.ob===S.ob.step)return;renderOnboarding(p);return}
  p.dataset.ob="";
  const chips=["How's my week looking?","What should I eat for dinner to hit protein?","Build me today's session","Am I on track for my goal?"];
  let h=`<div class="coach-head"><div class="avatar">K</div><div style="flex:1"><h2>Coach</h2><div class="small muted">Sees your food, training and weight logs</div></div>${S.chat.length?`<button class="chip" id="cClear">New chat</button>`:""}</div>`+reviewCard();
  if(!sample)h+=`<div class="card empty">The coach runs when this page is open in Claude.</div>`;
  else{
    h+=`<div class="chat" id="chat">${S.chat.length?S.chat.map(t=>`<div class="b ${t.role==="user"?"u":"a"}">${t.role==="user"?esc(t.content):mdLite(t.content)}</div>`).join(""):`<div class="card small muted">Ask about your eating, training or progress. Answers use what you've logged, so the more you log the better the advice.</div>`}${changesCard()}<div class="b a" id="live" hidden></div></div>
    ${S.chat.length?"":`<div class="chips">${chips.map(c=>`<button class="chip" data-q="${esc(c)}">${esc(c)}</button>`).join("")}</div>`}
    <div class="composer"><textarea class="i" id="cIn" rows="1" placeholder="Message your coach">${esc(draft)}</textarea><button class="kbd-hide" id="cHide" aria-label="Hide keyboard"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><button class="btn" id="cSend">${coachBusy?"Stop":"Send"}</button></div>`;
  }
  p.innerHTML=h;bindCoachToday(p);
  if(!sample)return;
  const inp=$("#cIn");inp.oninput=()=>draft=inp.value;inp.onfocus=()=>document.body.classList.add("typing");inp.onblur=()=>setTimeout(()=>{if(document.activeElement!==$("#cIn"))document.body.classList.remove("typing")},150);
  inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!coachBusy){e.preventDefault();send(inp.value)}};
  $("#cSend").onclick=()=>coachBusy?(coachCtl&&coachCtl.abort()):send(inp.value);
  p.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>send(b.dataset.q));
  const cl=$("#cClear");if(cl)cl.onclick=()=>{if(coachBusy)return;S.chat=[];render();write("coach/chat",r=>r.set({turns:[]}))};
  if(coachBusy){const l=$("#live");l.hidden=false;if(liveText)l.innerHTML=mdLite(liveText);else l.textContent="Thinking…"}
  const last=p.querySelector(".chat")&&p.querySelector(".chat").lastElementChild;if(last&&S.chat.length)last.scrollIntoView({block:"end"});
}
let liveText="";
async function send(text){
  text=(text||"").trim();if(!text||coachBusy)return;
  draft="";S.chat=[...S.chat,{role:"user",content:text}].slice(-40);coachBusy=true;liveText="";S.undo=null;S.lastChanges=null;render();
  coachCtl=new AbortController();
  const turns=S.chat.slice(-20);while(turns.length&&turns[0].role!=="user")turns.shift();
  const input=[{role:"user",content:rules()+"\n\nTHEIR CURRENT DATA:\n"+context()},...turns];
  const changes=[];let canTools=false;
  try{const l=await sample.limits();canTools=!!(l&&l.tools)}catch(e){}
  const opts={cache:false,signal:coachCtl.signal,onText:({text})=>{liveText=text;const l=$("#live");if(l){l.hidden=false;l.innerHTML=mdLite(text);l.scrollIntoView({block:"end"})}}};
  if(canTools)opts.tools=coachTools(changes);
  try{
    const {text:ans}=await sample(input,opts);
    S.chat=[...S.chat,{role:"assistant",content:ans+(changes.length?"\n\nChanges made: "+changes.join("; ")+".":"")}].slice(-40);
  }catch(e){
    if(e&&e.text)S.chat=[...S.chat,{role:"assistant",content:e.text}].slice(-40);
    if(!(e&&e.code==="cancelled"))toast(sampleErr(e));
  }finally{
    coachBusy=false;liveText="";S.lastChanges=changes.length?changes:null;if(!changes.length)S.undo=null;render();
    const turns2=S.chat;write("coach/chat",r=>r.set({turns:turns2}));
  }
}

{const blurIfOutside=e=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!e.target.closest("input,textarea,select,label,button,a"))a.blur()};document.addEventListener("touchstart",blurIfOutside,{passive:true});document.addEventListener("mousedown",blurIfOutside);
document.addEventListener("click",e=>{if(e.target.closest("#cHide")){const a=document.activeElement;if(a)a.blur();document.body.classList.remove("typing")}});}
boot();
</script>
